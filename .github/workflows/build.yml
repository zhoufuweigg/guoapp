name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true
      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: hongguojian
            label: 红果鉴（仅红果）
            arguments: ''
          - slug: zhenguojian
            label: 真果鉴（--all-sources 全部站源）
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 构建 ${{ matrix.label }}
        run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: 校验 Android 构建产物
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ ! -f dist/android/SHA256SUMS.txt ]; then
            echo "::error::dist/android 缺少 SHA256SUMS.txt，打包步骤未正常完成。"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            artifact="dist/android/${{ matrix.slug }}-${version}-${abi}.apk"
            if [ ! -f "$artifact" ]; then
              echo "::error::缺少 ${{ matrix.slug }} 的 $abi 安装包：$artifact"
              exit 1
            fi
          done
          {
            echo "### Android · ${{ matrix.label }}"
            echo ""
            echo "- 版本：$version"
            echo ""
            echo '```'
            cat dist/android/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: hongguojian
            label: 红果鉴（仅红果）
            arguments: ''
          - slug: zhenguojian
            label: 真果鉴（--all-sources 全部站源）
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 安装 MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $paths = @()
          foreach ($root in 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64') {
            $bin = Join-Path $root 'bin'
            if (Test-Path $bin) { $paths += $bin }
          }
          $paths += 'C:\ProgramData\chocolatey\bin'
          $paths = $paths | Select-Object -Unique
          $paths | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          $env:PATH = ($paths -join ';') + ';' + $env:PATH
          $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue
          if (-not $gcc) { $gcc = Get-Command gcc -ErrorAction SilentlyContinue }
          if (-not $gcc) { throw 'MinGW-w64 安装失败：PATH 中找不到 gcc，无法编译 Go cgo 核心。' }
          & $gcc.Source --version | Select-Object -First 1
      - name: 构建 ${{ matrix.label }}
        run: python scripts/build_windows.py ${{ matrix.arguments }}
      - name: 校验 Windows 构建产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*\S+' } | Select-Object -First 1
          if (-not $line) { throw 'pubspec.yaml 缺少合法版本号。' }
          $version = ($line -replace '^version:\s*', '').Trim()
          $zip = "dist/windows/${{ matrix.slug }}-$version-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "缺少 ${{ matrix.slug }} 的 Windows 安装包：$zip" }
          if (-not (Test-Path 'dist/windows/SHA256SUMS.txt')) { throw 'dist/windows 缺少 SHA256SUMS.txt，打包步骤未正常完成。' }
          Get-ChildItem dist/windows | Format-Table Name, Length
          Get-Content dist/windows/SHA256SUMS.txt
          @(
            "### Windows · ${{ matrix.label }}"
            ""
            "- 版本：$version"
            "- 安装包：$((Get-Item $zip).Length) 字节"
            ""
            '```'
            (Get-Content dist/windows/SHA256SUMS.txt) -join "`n"
            '```'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      # 运行器没有音频和图形设备，播放器自检结果仅供参考，不阻塞出包。
      - name: Windows 包播放自检
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.slug }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    if: false
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  release:
    needs: [android, windows]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          for directory in artifacts/*/; do
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
            apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          else
            apk_note="Android（未配置发布签名，当前为 debug 签名，仅供测试，不能覆盖正式版安装）："
          fi
          {
            printf '%s\n\n' "版本 ${version}。两个版本功能相同，区别只在站源范围，按需选择："
            printf '%s\n' "- 红果鉴 hongguojian：仅红果站源"
            printf '%s\n' "- 真果鉴 zhenguojian：全部站源"
            printf '\n%s\n' "$apk_note"
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "iOS（未签名，需自行签名后才能安装）："
            printf '%s\n' "- *-ios-unsigned.ipa：未签名 IPA，用 AltStore / Sideloadly / TrollStore 等工具自签后安装"
            printf '%s\n' "- *-ios-unsigned-app.zip：未签名 Runner.app 压缩包，供自行签名 / 打包使用"
            printf '\n%s\n' "Windows（解压后运行 hongguojian.exe 或 zhenguojian.exe）："
            printf '%s\n' "- *-windows-x64.zip：Windows 10/11 x64 完整包；构建机没有音频和图形设备，播放自检未通过，未做设备验收"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
            if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
              printf '%s\n' "签名证书 SHA-256：${{ vars.ANDROID_CERT_SHA256 }}"
            else
              printf '%s\n' "签名证书：未配置（当前为 debug 签名）"
            fi
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "红果鉴 / 真果鉴 ${version}" --notes-file notes.md
            # 清理上一次构建留下、本轮已不再产出的附件，避免下载到过期文件。
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "release/$name" ]; then
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
          else
            gh release create "$tag" release/* --title "红果鉴 / 真果鉴 ${version}" --notes-file notes.md
          fi
